name: Validate catalog

on:
  pull_request:
  push:
    branches: [staging, prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Seconds of work; anything approaching this is a hang, not a slow run.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: _lib
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Typecheck first, deliberately: bun executes TypeScript by stripping
      # types, so a type error in _lib never stops `bun run validate` from
      # running — it just makes its verdict untrustworthy. Checking the tool
      # before believing the tool keeps a broken checker from reporting a
      # green catalog.
      - name: Typecheck the tooling
        run: bun run typecheck
      - name: Validate blueprints and apps
        run: bun run validate
      # The checker's own tests: proves a dead URL is still detected as dead
      # and that the stall guard fires. Cheap (a few seconds, two small
      # requests) and it runs on fork PRs safely — no secrets, no downloads.
      - name: Self-test the source checker
        run: bun check-sources.ts --self-test
