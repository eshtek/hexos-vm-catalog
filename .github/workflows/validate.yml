name: Validate blueprints

on:
  pull_request:
  push:
    branches: [staging, prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _lib
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run validate
